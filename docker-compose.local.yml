services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tempmail
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-tempmail_local}
      POSTGRES_DB: tempmail
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tempmail -d tempmail"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_local_data:
